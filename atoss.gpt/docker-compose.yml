services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: atoss_gpt_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: atoss_gpt_users
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - atoss_network
    restart: unless-stopped

  # User Service (Node.js/Express)
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
      args:
        # Include devDependencies (nodemon) for compose-based dev runs
        INSTALL_DEV: "true"
        # Pin Node LTS inside container regardless of host version
        NODE_VERSION: 20-alpine
    container_name: atoss_user_service
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: atoss_gpt_users
      PORT: 4001
      AUTH_TOKEN_SECRET: dev-secret-change-in-production
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/user-service/src:/app/src
      - /app/node_modules
    networks:
      - atoss_network
    restart: unless-stopped
    command: npm run dev

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  atoss_network:
    driver: bridge
