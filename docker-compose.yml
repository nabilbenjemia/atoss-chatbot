version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - llm
      - authentication
      - conversation
    networks:
      - atoss-network

  llm:
    build:
      context: ./backend/llm
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/llm/.env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - hf_cache:/root/.cache
      - ./backend/llm/chroma_db_snowflake_600chunks_300overlapping:/app/chroma_db_snowflake_600chunks_300overlapping
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - atoss-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  authentication:
    build:
      context: ./backend/authentication
      dockerfile: Dockerfile
    ports:
      - "4003:4003"
    env_file:
      - ./backend/authentication/.env
    networks:
      - atoss-network
    restart: unless-stopped

  conversation:
    build:
      context: ./backend/conversation
      dockerfile: Dockerfile
    ports:
      - "4004:4004"
    env_file:
      - ./backend/conversation/.env
    depends_on:
      llm:
        condition: service_healthy
      authentication:
        condition: service_started
    networks:
      - atoss-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./init-ollama.sh:/usr/local/bin/init-ollama.sh:ro
    env_file:
      - ./backend/llm/.env
    networks:
      - atoss-network
    entrypoint: ["/bin/sh", "/usr/local/bin/init-ollama.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s
    restart: unless-stopped

networks:
  atoss-network:
    driver: bridge

volumes:
  ollama_data:
  hf_cache:
